name: DeskLight build and checks
on:
  push:
    branches: [main, feature/lab-2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  firmware-and-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ARM firmware
        run: make build
      - name: Portable tests and contracts
        run: make test
      - name: Coverage
        run: make coverage
      - name: Sanitizers
        run: make sanitize
